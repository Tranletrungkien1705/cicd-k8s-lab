# Giu demo Render "thuc" trong gio thuc (0-16 UTC ~ 7h-23h VN) de tranh cold-start 50s.
# Ping /healthz moi ~10 phut (Render ngu sau 15 phut khong traffic).
# Chay tren runner GitHub-hosted (free). Luu y: cron cua GitHub Actions co the tre vai phut.
name: Keep demo warm

on:
  schedule:
    - cron: '*/10 0-16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo
        run: |
          curl -fsS --max-time 90 https://cicd-k8s-lab-demo.onrender.com/healthz \
            && echo "demo awake" || echo "ping failed (co the dang cold-start) - bo qua"
